# fly.toml app configuration file generated for fly-clawdbot on 2026-01-27T22:04:25+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-clawdbot'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  CLAWDBOT_PREFER_PNPM = '1'
  CLAWDBOT_STATE_DIR = '/data'
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=1536'

[processes]
  app = "node dist/index.js gateway --allow-unconfigured --port 3000 --bind lan"

# [http_service]
#   internal_port = 3000
#   force_https = true
#   auto_stop_machines = 'off'  # Keep running for persistent connections
#   auto_start_machines = true
#   min_machines_running = 1
#   processes = ["app"]

[[mounts]]
  source = 'clawdbot_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048mb'
